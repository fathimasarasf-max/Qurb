<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b110e" />
  <title>Qurb</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%230b110e' width='32' height='32' rx='8'/%3E%3Cpath fill='%239aaf9e' d='M16 6l1.6 4.8H22l-4 2.9 1.5 4.8L16 15.6 12.5 18.5 14 13.7 10 10.8h4.4z'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0b110e;
      --surface: #131a16;
      --fg: #e8ece6;
      --muted: #9aaf9e;
      --subtle: #6e8274;
      --primary: #9aaf9e;
      --line: rgba(232, 236, 230, 0.12);
      --safe-t: max(1rem, env(safe-area-inset-top));
      --safe-b: max(1rem, env(safe-area-inset-bottom));
      color-scheme: dark;
      /* Scale the whole rem-based layout up for a TV viewed from across a room.
         Clamped so it behaves whether the webOS browser reports a 1080p-ish
         or a 4K-ish CSS viewport width. */
      font-size: clamp(22px, 1.5vw, 34px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
      min-height: 100vh;
      overflow-x: hidden;
    }
    button, [role="button"] { cursor: pointer; }
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
    }
    /* Visible focus ring so the TV remote's D-pad / spatial navigation
       shows which control is selected. */
    button:focus-visible, a:focus-visible {
      outline: 0.15rem solid var(--primary);
      outline-offset: 0.2rem;
      border-radius: 999px;
    }
    .wrap {
      max-width: 28rem;
      margin: 0 auto;
      /* extra horizontal padding acts as a TV-safe margin on top of the
         existing top/bottom safe-area padding */
      padding: var(--safe-t) max(1.25rem, 3vw) var(--safe-b);
    }
    body.wide .wrap { max-width: 90rem; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .brand { font-family: Palatino, "Iowan Old Style", Georgia, serif; font-size: 1.35rem; }
    .brand span { font-style: italic; }
    .eyebrow { margin: 0.2rem 0 0; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--subtle); }
    .icon {
      width: 2.75rem; height: 2.75rem; border-radius: 999px;
      display: grid; place-items: center; color: var(--muted);
    }
    .hero, .card {
      background: var(--surface);
      border-radius: 1.6rem;
      box-shadow: 0 0 0 1px var(--line);
    }
    .hero { margin-top: 1rem; padding: 1.35rem 1.25rem 1.4rem; }
    .date { margin: 0; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--subtle); }
    .hijri { margin: 0.25rem 0 0; font-family: Palatino, Georgia, serif; font-style: italic; color: var(--muted); }
    .kicker { margin: 1.1rem 0 0; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--primary); }
    .hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 0.75rem; }
    .hero h1 { margin: 0.15rem 0 0; font-family: Palatino, Georgia, serif; font-size: 3rem; font-weight: 500; line-height: 0.95; }
    .place { margin: 0.4rem 0 0; color: var(--muted); font-size: 0.92rem; }
    .when { text-align: right; }
    .when strong { display: block; font-family: Palatino, Georgia, serif; font-size: 1.7rem; font-weight: 500; font-variant-numeric: tabular-nums; }
    .when em { display: block; margin-top: 0.35rem; font-style: normal; color: var(--primary); font-variant-numeric: tabular-nums; }
    .when small { color: var(--muted); font-variant-numeric: tabular-nums; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 1.25rem; }
    .bar h2 { margin: 0; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--subtle); font-weight: 600; }
    .tools { display: flex; align-items: center; gap: 0.25rem; }
    .seg { display: flex; padding: 0.15rem; border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
    .seg button, .texty { height: 2rem; border-radius: 999px; color: var(--muted); }
    .seg button { width: 2rem; }
    .seg button[aria-pressed="true"] { background: rgba(154, 175, 158, 0.18); color: var(--primary); }
    .texty { padding: 0 0.55rem; font-size: 0.8rem; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; margin-top: 0.8rem; }
    .tabs button { height: 2.5rem; border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); color: var(--muted); }
    .tabs button[aria-pressed="true"] { color: var(--fg); }
    .board { display: grid; gap: 0.9rem; margin-top: 0.9rem; }
    body.wide .board.cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card { padding: 1rem; min-width: 0; }
    .card h3 { margin: 0; font-family: Palatino, Georgia, serif; font-size: 1.25rem; font-weight: 500; line-height: 1.25; }
    .meta { margin: 0.3rem 0 0; color: var(--muted); font-size: 0.78rem; }
    .top { display: flex; gap: 0.5rem; align-items: flex-start; }
    .top > div { min-width: 0; flex: 1; }
    .star { width: 2.5rem; height: 2.5rem; border-radius: 999px; color: var(--muted); flex: none; }
    .star.on { color: var(--primary); background: rgba(154, 175, 158, 0.12); }
    .rows { margin-top: 0.8rem; border-radius: 1rem; overflow: hidden; background: rgba(11, 17, 14, 0.55); }
    .row, .head {
      display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; align-items: center;
      padding: 0.55rem 0.75rem;
    }
    .head { color: var(--subtle); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; }
    .row + .row { border-top: 1px solid var(--line); }
    .row.on { background: rgba(154, 175, 158, 0.12); }
    .name { margin: 0; font-size: 0.92rem; }
    .adhan { margin: 0; color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
    .iqama { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; }
    .row.on .name, .row.on .iqama { color: var(--primary); }
    body.tiles .rows { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.35rem; background: transparent; overflow: visible; }
    body.tiles .head { display: none; }
    body.tiles .row { display: block; border: 0; border-radius: 0.8rem; background: rgba(11, 17, 14, 0.55); padding: 0.5rem; }
    body.tiles .iqama { margin-top: 0.25rem; }
    .foot { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-top: 0.7rem; color: var(--subtle); font-size: 0.72rem; }
    .go { color: var(--muted); text-decoration: none; font-size: 0.85rem; }
    .empty, .err { padding: 1.5rem 1rem; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand"><span>قرب</span> · Qurb</div>
        <p class="eyebrow">Nearest Iqama</p>
      </div>
    </header>
    <section class="hero" id="hero"><p class="place">Loading today’s Iqama…</p></section>
    <div class="bar">
      <h2>Nearby · Masjidal</h2>
      <div class="tools">
        <div class="seg" role="group" aria-label="Layout">
          <button id="stack" aria-pressed="false" aria-label="Stack masjids">☰</button>
          <button id="grid" aria-pressed="true" aria-label="Three per row">▦</button>
        </div>
        <button class="texty" id="refresh">Refresh</button>
      </div>
    </div>
    <div class="tabs">
      <button id="tab-nearby" aria-pressed="true">Nearby</button>
      <button id="tab-saved" aria-pressed="false">Saved</button>
    </div>
    <div class="board" id="board"></div>
  </div>
  <script>
    const ORIGIN = { lat: 40.545, lng: -74.46, label: "Piscataway" };
    const MASJIDS = [
      { id: "3wdq6lKb", name: "Muslim Center of Middlesex", address: "1000 Hoes Lane", city: "Piscataway", lat: 40.5295875, lng: -74.4685166 },
      { id: "3wdqkjLb", name: "Iqra Academy", address: "Stelton Road", city: "Piscataway", lat: 40.5513376, lng: -74.4332487 },
      { id: "xwLVXxdJ", name: "Masjid Al-Wali", address: "Olsen Avenue", city: "Edison", lat: 40.5663309, lng: -74.3884288 },
      { id: "lJAmBPdR", name: "Muslim Community of New Jersey", address: "South 2nd Street", city: "Fords", lat: 40.5298556, lng: -74.3152231 }
    ];
    const PRAYERS = [
      ["fajr", "Fajr", "fajr"],
      ["dhuhr", "Dhuhr", "zuhr"],
      ["asr", "Asr", "asr"],
      ["maghrib", "Maghrib", "maghrib"],
      ["isha", "Isha", "isha"]
    ];
    const TZ = "America/New_York";
    const board = document.getElementById("board");
    const hero = document.getElementById("hero");
    let rows = [];
    let layout = localStorage.getItem("qurb.html.layout") || "grid";
    let tab = "nearby";
    let saved = JSON.parse(localStorage.getItem("qurb.html.saved") || "[]");

    function miles(a, b) {
      const r = Math.PI / 180;
      const dLat = (b.lat - a.lat) * r;
      const dLng = (b.lng - a.lng) * r;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
      return 3958.8 * 2 * Math.asin(Math.min(1, Math.sqrt(h)));
    }
    function clock(raw) {
      if (!raw) return null;
      const m = String(raw).trim().match(/^(\d{1,2}):(\d{2})\s*([AaPp][Mm])?$/);
      if (!m || m[3] == null && Number(m[1]) > 23) return null;
      if (raw.trim() === "-" || raw.trim() === "—") return null;
      let h = Number(m[1]);
      const min = Number(m[2]);
      const mer = m[3] && m[3].toLowerCase();
      if (mer === "pm" && h < 12) h += 12;
      if (mer === "am" && h === 12) h = 0;
      if (h > 23 || min > 59) return null;
      return { h, min };
    }
    function pretty(raw) {
      const c = clock(raw);
      if (!c) return "—";
      const mer = c.h >= 12 ? "PM" : "AM";
      return (c.h % 12 || 12) + ":" + String(c.min).padStart(2, "0") + " " + mer;
    }
    function parts(date) {
      const bag = {};
      new Intl.DateTimeFormat("en-US", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: "h23" })
        .formatToParts(date).forEach((p) => { if (p.type !== "literal") bag[p.type] = p.value; });
      return { y: +bag.year, m: +bag.month, d: +bag.day, h: +bag.hour, min: +bag.minute, wd: bag.weekday };
    }
    function atClock(c, offset, now) {
      const p = parts(now);
      const utc = Date.UTC(p.y, p.m - 1, p.d + offset, c.h, c.min);
      const as = parts(new Date(utc));
      const got = Date.UTC(as.y, as.m - 1, as.d, as.h, as.min);
      return new Date(utc - (got - utc));
    }
    function hijri(raw) {
      const m = String(raw || "").match(/^(\d+)-(.+)-(\d+)$/);
      return m ? m[3] + " " + m[2] + " " + m[1] : (raw || "");
    }
    function blank(v) {
      const s = (v || "").trim();
      return !s || s === "-" || s === "—" ? null : s;
    }

    async function load() {
      hero.innerHTML = "<p class='place'>Loading today’s Iqama…</p>";
      board.innerHTML = "";
      const packed = await Promise.all(MASJIDS.map(async (m) => {
        const res = await fetch("https://masjidal.com/api/v1/time?masjid_id=" + m.id);
        if (!res.ok) throw new Error("Masjidal " + res.status);
        const json = await res.json();
        const salah = json.data.salah || {};
        const iqama = json.data.iqama || {};
        const times = {};
        PRAYERS.forEach(([key, , api]) => {
          times[key] = {
            adhan: blank(salah[api]),
            iqama: blank(iqama[api]) || (key === "maghrib" ? blank(salah[api]) : null)
          };
        });
        const jumuah = ["jummah1", "jummah2", "jummah3"].map((k) => blank(iqama[k])).filter(Boolean);
        return { ...m, times, jumuah, hijri: hijri(json.data.hijri), sunrise: blank(salah.sunrise), miles: miles(ORIGIN, m) };
      }));
      rows = packed.sort((a, b) => a.miles - b.miles);
      paint();
    }

    function nextOf(m, now) {
      for (const day of [0, 1]) {
        for (const [key, label] of PRAYERS) {
          const slot = m.times[key];
          const src = clock(slot.iqama) || clock(slot.adhan);
          if (!src) continue;
          const when = atClock(src, day, now);
          if (when.getTime() > now.getTime() + 15000) {
            return { key, label, when, display: pretty(slot.iqama || slot.adhan), adhan: slot.adhan ? pretty(slot.adhan) : null, kind: slot.iqama ? "Iqama" : "Adhan", masjid: m };
          }
        }
      }
      return null;
    }
    function soonest(now) {
      return rows.map((m) => nextOf(m, now)).filter(Boolean).sort((a, b) => a.when - b.when)[0] || null;
    }
    function countdown(when, now) {
      const min = Math.round((when - now) / 60000);
      if (min <= 0) return "now";
      const h = Math.floor(min / 60);
      return h ? h + "h " + (min % 60) + "m" : min + "m";
    }

    function paint() {
      const now = new Date();
      const next = soonest(now);
      const p = parts(now);
      const dateLine = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "long", month: "short", day: "numeric" }).format(now);
      hero.replaceChildren();
      const date = document.createElement("p");
      date.className = "date";
      date.textContent = dateLine.toUpperCase();
      const hi = document.createElement("p");
      hi.className = "hijri";
      hi.textContent = (rows[0] && rows[0].hijri) || "";
      hero.append(date, hi);
      if (next) {
        const k = document.createElement("p");
        k.className = "kicker";
        k.textContent = "Next " + next.kind;
        const row = document.createElement("div");
        row.className = "hero-row";
        const left = document.createElement("div");
        const h = document.createElement("h1");
        h.textContent = next.label;
        const place = document.createElement("p");
        place.className = "place";
        place.textContent = next.masjid.name;
        left.append(h, place);
        const right = document.createElement("div");
        right.className = "when";
        const strong = document.createElement("strong");
        strong.textContent = next.display;
        const em = document.createElement("em");
        em.textContent = "in " + countdown(next.when, now);
        right.append(strong, em);
        if (next.kind === "Iqama" && next.adhan) {
          const sm = document.createElement("small");
          sm.textContent = "Adhan " + next.adhan;
          right.append(sm);
        }
        row.append(left, right);
        hero.append(k, row);
      }
      const list = tab === "saved" ? rows.filter((m) => saved.includes(m.id)) : rows;
      board.replaceChildren();
      document.body.classList.toggle("wide", layout === "grid");
      document.body.classList.toggle("tiles", layout === "grid");
      board.classList.toggle("cards", layout === "grid");
      if (!list.length) {
        const p0 = document.createElement("p");
        p0.className = "empty card";
        p0.textContent = tab === "saved" ? "No saved masjids yet. Star up to three." : "No masjids loaded.";
        board.append(p0);
        return;
      }
      list.forEach((m) => board.append(card(m, next, now, p)));
    }

    function card(m, next, now) {
      const art = document.createElement("article");
      art.className = "card";
      const top = document.createElement("div");
      top.className = "top";
      const info = document.createElement("div");
      const h = document.createElement("h3");
      h.textContent = m.name;
      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = m.miles.toFixed(1) + " mi · " + m.address + " · " + m.city;
      info.append(h, meta);
      const star = document.createElement("button");
      star.className = "star" + (saved.includes(m.id) ? " on" : "");
      star.setAttribute("aria-label", saved.includes(m.id) ? "Remove from saved" : "Save masjid");
      star.textContent = saved.includes(m.id) ? "★" : "☆";
      star.onclick = () => toggleSave(m.id);
      top.append(info, star);
      const table = document.createElement("div");
      table.className = "rows";
      if (layout !== "grid") {
        const head = document.createElement("div");
        head.className = "head";
        head.innerHTML = "<span>Prayer · Adhan</span><span>Iqama</span>";
        table.append(head);
      }
      const upcoming = next && next.masjid.id === m.id ? next.key : (nextOf(m, now) || {}).key;
      PRAYERS.forEach(([key, label]) => {
        const slot = m.times[key];
        const row = document.createElement("div");
        row.className = "row" + (upcoming === key ? " on" : "");
        const left = document.createElement("div");
        const name = document.createElement("p");
        name.className = "name";
        name.textContent = label;
        const ad = document.createElement("p");
        ad.className = "adhan";
        ad.textContent = slot.adhan ? (layout === "grid" ? pretty(slot.adhan) : "Adhan " + pretty(slot.adhan)) : "";
        left.append(name, ad);
        const iq = document.createElement("p");
        iq.className = "iqama";
        iq.textContent = slot.iqama ? pretty(slot.iqama) : "—";
        row.append(left, iq);
        table.append(row);
      });
      m.jumuah.forEach((t, i) => {
        const row = document.createElement("div");
        row.className = "row";
        const left = document.createElement("div");
        const name = document.createElement("p");
        name.className = "name";
        name.textContent = "Jumuah" + (m.jumuah.length > 1 ? " " + (i + 1) : "");
        const ad = document.createElement("p");
        ad.className = "adhan";
        ad.textContent = "Friday";
        left.append(name, ad);
        const iq = document.createElement("p");
        iq.className = "iqama";
        iq.textContent = pretty(t);
        row.append(left, iq);
        table.append(row);
      });
      const foot = document.createElement("div");
      foot.className = "foot";
      const note = document.createElement("p");
      note.textContent = "Salah and Iqama from Masjidal";
      const go = document.createElement("a");
      go.className = "go";
      go.href = "https://maps.apple.com/?daddr=" + m.lat + "," + m.lng;
      go.textContent = "Go";
      go.target = "_blank";
      go.rel = "noreferrer";
      foot.append(note, go);
      art.append(top, table, foot);
      return art;
    }

    function toggleSave(id) {
      if (saved.includes(id)) saved = saved.filter((x) => x !== id);
      else if (saved.length < 3) saved = saved.concat(id);
      localStorage.setItem("qurb.html.saved", JSON.stringify(saved));
      document.getElementById("tab-saved").textContent = "Saved" + (saved.length ? " · " + saved.length : "");
      paint();
    }
    function setLayout(next) {
      layout = next;
      localStorage.setItem("qurb.html.layout", next);
      document.getElementById("stack").setAttribute("aria-pressed", String(next === "stack"));
      document.getElementById("grid").setAttribute("aria-pressed", String(next === "grid"));
      paint();
    }
    function setTab(next) {
      tab = next;
      document.getElementById("tab-nearby").setAttribute("aria-pressed", String(next === "nearby"));
      document.getElementById("tab-saved").setAttribute("aria-pressed", String(next === "saved"));
      paint();
    }

    document.getElementById("stack").onclick = () => setLayout("stack");
    document.getElementById("grid").onclick = () => setLayout("grid");
    document.getElementById("tab-nearby").onclick = () => setTab("nearby");
    document.getElementById("tab-saved").onclick = () => setTab("saved");
    document.getElementById("refresh").onclick = () => load().catch(showError);
    document.getElementById("tab-saved").textContent = "Saved" + (saved.length ? " · " + saved.length : "");
    document.getElementById("stack").setAttribute("aria-pressed", String(layout === "stack"));
    document.getElementById("grid").setAttribute("aria-pressed", String(layout === "grid"));
    document.body.classList.toggle("wide", layout === "grid");
    document.body.classList.toggle("tiles", layout === "grid");

    function showError(err) {
      hero.innerHTML = "<p class='place'>Could not reach Masjidal. Check the connection and tap Refresh.</p>";
      board.innerHTML = "";
      console.error(err);
    }
    load().catch(showError);
    setInterval(() => { if (rows.length) paint(); }, 15000);
    // Re-fetch iqama times periodically (this runs unattended on a TV,
    // so it should stay fresh without anyone pressing Refresh).
    setInterval(() => { load().catch(showError); }, 15 * 60 * 1000);
    // Do a full page reload once a day (overnight) so a display left on
    // for weeks doesn't accumulate memory/state drift in the TV browser.
    (function scheduleDailyReload() {
      const target = new Date();
      target.setHours(3, 0, 0, 0);
      if (target.getTime() <= Date.now()) target.setDate(target.getDate() + 1);
      setTimeout(() => location.reload(), target.getTime() - Date.now());
    })();
  </script>
</body>
</html>
